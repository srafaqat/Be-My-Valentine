<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>For You 💕</title>

<style>
  body {
    height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  .container {
    width: 500px;
    height: 520px;
    background: white;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  h1 {
    color: #ff4d6d;
    min-height: 90px;
    margin: 0;
  }

 img {
  max-width: 100%;
  max-height: 320px;
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: 15px;
  margin: 15px auto 0;
  display: block;
}

  .button-container {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 16px;
  }

  button {
    padding: 12px 24px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.2s ease, left 0.2s ease, top 0.2s ease;
    white-space: nowrap;
  }

  #nextBtn,
  #yesBtn {
    background-color: #ff4d6d;
    color: white;
  }

  #yesBtn,
  #noBtn {
    display: none; /* shown via JS when needed */
  }

  #noBtn {
    background-color: #adb5bd;
    transform: scale(1);
  }

  /* 💕 HEARTS */
  .heart {
    position: absolute;
    animation: floatUp 6s linear forwards;
    pointer-events: none;
  }

  @keyframes floatUp {
    from { transform: translateY(0) scale(1); opacity: 1; }
    to   { transform: translateY(-700px) scale(1.5); opacity: 0; }
  }
#yesBtn {
  z-index: 10;
}

#noBtn {
  z-index: 1;
}
</style>
</head>

<body>
<div class="container" id="container">
  <h1 id="text"></h1>
  <img id="gif" src="" alt="gif">

  <div class="button-container">
    <button id="nextBtn">Next 👉</button>
    <button id="yesBtn">YES 💖</button>
    <button id="noBtn">NO 😒</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
/* ---------- CONTENT ---------- */
const texts = [
  "So there is a special day coming up…",
  "And I was thinking about how lucky I am",
  "Because I have someone really special",
  "So I wanted to ask you something…",
  "Will you be...",
  "a fatass with me again... For some HOMEMADE Chicken Karahi?",

  "On to slightly more important matters...",
  "So… I’ve been keeping a tiny secret",
  "It's just been on my mind a lot.",
  "Which is funny, because after three years, I’m usually terrible at keeping secrets from you",
  "And even though you probably already know it…",
  "I wanted to say",
  /* ---------- dress ---------- */
  "I pick you Today...",
  /* ---------- blossom ---------- */
  "Tomorrow...",
  /* ---------- promise ---------- */
  "and ALWAYS…",
  /* ---------- sunset ---------- */
  "Will you be my Valentine?"
];

const gifs = [
  "https://media.giphy.com/media/26FLdmIp6wJr91JAI/giphy.gif",
  "https://media.giphy.com/media/3NtY188QaxDdC/giphy.gif",
  "https://media.giphy.com/media/3oriO6qJiXajN0TyDu/giphy.gif",
  "https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif",
  "https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif",
  "https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif",

  "https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExN2J0YWI1dXplbTRhdGJtaHhubWJuMml0eWtvbWNrMXI1MzlxNnd5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/PlgjaVXdwwTcILCLXH/giphy.gif",
  "https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExbmsxcmE1cTM4aDRkM3NpcHY4OWJwcDd1YzE0ZXA5a2FnaG53a3l2eCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/rZQYNXSCsPHS4t8uqv/giphy.gif",
  "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExZzVrNWxhdDBhNDNyamEycTV2eXhubng2dXFhZG9zYXRoMWgxNWZ4ayZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/eFcmvMNzZ40FQrVUBx/giphy.gif",
  "https://media.tenor.com/Q_kGvuVVgUEAAAAM/smiling-alexis.gif",
  "https://media.giphy.com/media/l0HlBO7eyXzSZkJri/giphy.gif",
  "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExejNibnNpZ2t5cGExejNoaXI2MWtvMTZncG0wb3dqNjgzMDN4NGg5MCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/DANPZFqusHfO/giphy.gif",
  "https://raw.githubusercontent.com/srafaqat/Be-My-Valentine/main/images/dress.jpeg",
  "https://raw.githubusercontent.com/srafaqat/Be-My-Valentine/main/images/blossom.jpeg",
  "https://raw.githubusercontent.com/srafaqat/Be-My-Valentine/main/images/promise.JPEG",
"https://raw.githubusercontent.com/srafaqat/Be-My-Valentine/main/images/sunset.jpeg",
];

const karahiNoTexts = [
  "It's not even good.",
  "Are you sure?",
  "Don't do this to me",
  "It’s so much work",
  "ONLY if YOU help",
  "Remeber you hate my cooking!!",
  "😒"
];

/* ---------- STATE ---------- */
let index = 0;
let stage = "story";     // "story" | "karahi" | "valentine"
let karahiHover = 0;
let canClickYes = false;
let confettiLoop = null;

/* ---------- ELEMENTS ---------- */
const textEl = document.getElementById("text");
const gifEl = document.getElementById("gif");
const nextBtn = document.getElementById("nextBtn");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const container = document.getElementById("container");

/* ---------- HELPERS ---------- */
function resetYesNoVisuals() {
  // Put buttons back into the centered flex row
  yesBtn.style.position = "static";
  yesBtn.style.left = "";
  yesBtn.style.top = "";

  noBtn.style.position = "static";
  noBtn.style.left = "";
  noBtn.style.top = "";

  noBtn.style.transform = "scale(1)";
  yesBtn.textContent = "YES 💖";
  noBtn.textContent = "NO 😒";
}

/* ---------- INIT ---------- */
textEl.textContent = texts[0];
gifEl.src = gifs[0];

/* ---------- NEXT ---------- */
nextBtn.onclick = () => {
  if (index >= texts.length - 1) return; // safety
  index++;

  textEl.textContent = texts[index];
  gifEl.src = gifs[index];

  // Default view: only Next button
  stage = "story";
  yesBtn.style.display = "none";
  noBtn.style.display = "none";
  nextBtn.style.display = "inline-block";
  resetYesNoVisuals();

  // KARAHI STAGE
  if (texts[index].includes("Chicken Karahi")) {
    stage = "karahi";
    nextBtn.style.display = "none";
    yesBtn.style.display = "inline-block";
    noBtn.style.display = "inline-block";

    karahiHover = 0;
    canClickYes = false;
    resetYesNoVisuals();
  }

  // VALENTINE STAGE (simple buttons, no movement, no text changes)
  if (texts[index] === "Will you be my Valentine?") {
    stage = "valentine";
    nextBtn.style.display = "none";
    yesBtn.style.display = "inline-block";
    noBtn.style.display = "inline-block";

    resetYesNoVisuals();
  }
};

/* ---------- KARAHI YES HOVER (ONLY when stage === "karahi") ---------- */
yesBtn.onmouseenter = () => {
  if (stage !== "karahi" || canClickYes) return;

  karahiHover++;

  if (karahiHover < 6) {
    const r = container.getBoundingClientRect();
    yesBtn.style.position = "absolute";
 yesBtn.style.zIndex = "10";   // ✅ keeps YES on top
  noBtn.style.zIndex = "1";     // ✅ keeps NO underneath
    yesBtn.style.left = (Math.random() * (r.width - 120)) + "px";
    yesBtn.style.top  = (Math.random() * (r.height - 140)) + "px";
  } else {
  canClickYes = true;
  // DO NOT reset position — keep it where it last moved
}

  noBtn.style.transform = `scale(${1 + 0.3 * karahiHover})`;
  noBtn.textContent = karahiNoTexts[karahiHover % karahiNoTexts.length];
};

/* ---------- NO hover does NOTHING for valentine ---------- */
noBtn.onmouseenter = () => {
  // Intentionally blank for valentine (and story)
  // Karahi behavior is already handled by YES hover above.
};

/* ---------- YES CLICK ---------- */
yesBtn.onclick = () => {
  // 🍗 KARAHI COMPLETE
  if (stage === "karahi") {
    if (!canClickYes) return;

    stage = "story";
    yesBtn.style.display = "none";
    noBtn.style.display = "none";

    gifEl.src = "https://i.giphy.com/4FTCsLuQUIUapAdIVx.webp";
    textEl.textContent = "FINE... you win 😅";
    index++; 

    // confetti loop
    confettiLoop = setInterval(() => {
      confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });
    }, 1200);

    setTimeout(() => {
      clearInterval(confettiLoop);
      nextBtn.style.display = "inline-block";
      resetYesNoVisuals();
    }, 5000);

    return;
  }

  // 💘 VALENTINE YES (hearts)
  if (stage === "valentine") {
    yesBtn.style.display = "none";
    noBtn.style.display = "none";
    nextBtn.style.display = "none";

    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = Math.random() > 0.5 ? "💖" : "💗";
      heart.style.left = Math.random() * 100 + "%";
      heart.style.bottom = "-20px";
      heart.style.fontSize = (20 + Math.random() * 25) + "px";
      container.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }, 250);
  }
};

/* ---------- NO CLICK (does nothing for valentine) ---------- */
noBtn.onclick = () => {
  // If you want "NO" to do something on Valentine later, add it here.
};
</script>
</body>
</html>
